apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesa-manager-app
  namespace: mesa-manager
  labels:
    app: mesa-manager
    component: nextjs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mesa-manager
      component: nextjs
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mesa-manager
        component: nextjs
    spec:
      containers:
        - name: nextjs
          image: your-registry/mesa-manager:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_SUPABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: mesa-config
                  key: NEXT_PUBLIC_SUPABASE_URL
            - name: NEXT_PUBLIC_SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: mesa-secrets
                  key: SUPABASE_ANON_KEY
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: mesa-secrets
                  key: SUPABASE_SERVICE_ROLE_KEY
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mesa-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: mesa-secrets
                  key: STRIPE_WEBHOOK_SECRET
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: mesa-manager-svc
  namespace: mesa-manager
spec:
  selector:
    app: mesa-manager
    component: nextjs
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mesa-manager-ingress
  namespace: mesa-manager
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
    - hosts:
        - app.mesamanager.es
      secretName: mesa-tls
  rules:
    - host: app.mesamanager.es
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mesa-manager-svc
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mesa-manager-hpa
  namespace: mesa-manager
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mesa-manager-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mesa-config
  namespace: mesa-manager
data:
  NEXT_PUBLIC_SUPABASE_URL: "https://your-project.supabase.co"
  NEXT_PUBLIC_APP_URL: "https://app.mesamanager.es"
  NEXT_PUBLIC_APP_NAME: "MesaManager"
---
# IMPORTANTE: Reemplaza los valores con tus secretos reales
# kubectl create secret generic mesa-secrets \
#   --from-literal=SUPABASE_ANON_KEY=... \
#   --from-literal=SUPABASE_SERVICE_ROLE_KEY=... \
#   --from-literal=STRIPE_SECRET_KEY=... \
#   --from-literal=STRIPE_WEBHOOK_SECRET=... \
#   -n mesa-manager
apiVersion: v1
kind: Secret
metadata:
  name: mesa-secrets
  namespace: mesa-manager
type: Opaque
stringData:
  SUPABASE_ANON_KEY: "REPLACE_ME"
  SUPABASE_SERVICE_ROLE_KEY: "REPLACE_ME"
  STRIPE_SECRET_KEY: "REPLACE_ME"
  STRIPE_WEBHOOK_SECRET: "REPLACE_ME"
